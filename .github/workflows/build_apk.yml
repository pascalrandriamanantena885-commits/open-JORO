name: build_apk

# Builds the offline calibrator APK (JORO + Stockfish inside) and the JORO arm64 engine file you can
# import into the app to test an update.
# If a joro-repo*.tgz archive sits in the repo root, it is extracted automatically before the build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "experience/**"
      - "*.tgz"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # extracts the project archive from the repo root (if any); otherwise uses the files as committed
      - name: Extract project archive
        run: |
          shopt -s nullglob
          ARCH=(joro-repo*.tgz)
          if [ ${#ARCH[@]} -eq 0 ]; then
            echo "No .tgz archive in repo root, using files as committed."
            exit 0
          fi
          A="${ARCH[-1]}"
          echo "Extracting $A"
          tar tzf "$A" | head -20
          tar xzf "$A"
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is already installed on ubuntu-latest (ANDROID_HOME). We only add NDK + CMake.
      - name: Android NDK + CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # finds the project even if it sits in a sub-folder of the repo; explains clearly if android/ is missing
      - name: Locate project
        run: |
          S=$(find . -name build_engines_android.sh -not -path "./.git/*" | head -1)
          if [ -z "$S" ]; then
            echo "::error::build_engines_android.sh not found: no android/ folder in the repo or in the .tgz archive. Files in the repo:"
            git ls-files | head -100
            exit 1
          fi
          ROOT=$(cd "$(dirname "$S")/../.." && pwd)
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build engines (JORO + Stockfish) for arm64
        run: bash "$ROOT/android/tools/build_engines_android.sh"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p "$ROOT/android" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: joro-calibrator-apk
          path: ${{ env.ROOT }}/android/app/build/outputs/apk/debug/*.apk

      # the file to use with "Import moteur" inside the app
      - uses: actions/upload-artifact@v4
        with:
          name: joro-engine-arm64
          path: ${{ env.ROOT }}/android/app/src/main/jniLibs/arm64-v8a/libjoro.so

      - uses: actions/upload-artifact@v4
        if: hashFiles('**/experience/joro.exp') != ''
        with:
          name: joro-experience
          path: ${{ env.ROOT }}/experience/joro.exp
